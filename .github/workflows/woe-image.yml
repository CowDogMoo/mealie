name: Woe Image

# Fork image build. Upstream's publish.yml builds through Depot.dev with the
# maintainers' Docker Hub secrets, and its caller (nightly.yml) is gated on
# `github.repository == 'mealie-recipes/mealie'`, so this fork can reuse
# neither. It does reuse upstream's build-package.yml (pnpm generate -> uv
# build) and then builds docker/Dockerfile with the built `dist/` supplied as
# the `packages` build context, exactly as `task docker:build-from-package`
# does locally.
#
# GHCR VISIBILITY DECISION (root plan D7 / P5). This pushes to
# ghcr.io/cowdogmoo/mealie using the repository's built-in GITHUB_TOKEN, and
# k8s8 pulls with no credentials at all. So the package has to be anonymously
# pullable, or the `home-automation` namespace needs an imagePullSecret. We
# chose pullable: it is simpler, and the image holds nothing secret - it is
# upstream Mealie plus our feedback code.
#
# MEASURED, do not assume. An earlier version of this comment asserted that
# GHCR always creates a new package private and that a human therefore had to
# flip it by hand. That was wrong here: CowDogMoo/mealie is a public fork, the
# package created by the first push of this workflow came out public on its
# own, and an anonymous manifest fetch (no credentials, the way a kubelet with
# no pull secret does it) returned 200. Re-measured 2026-09-01 against
# v3.24.0-woe.dev.688883b: still public, still anonymously pullable.
#
# Do not invert that into an assumption either. If the fork is ever made
# private, or the package is deleted and recreated, it can come out private
# again - and GITHUB_TOKEN can push to a package but cannot change its
# visibility, so the fix would be a one-off flip in the package settings (or an
# imagePullSecret). Before the first deploy of a new package, verify:
#
#   gh api /orgs/CowDogMoo/packages/container/mealie --jq .visibility
#
# A private package does not fail this build. It fails the DEPLOY: the pod sits
# in ImagePullBackOff on an unauthorized manifest pull, hours later, with
# nothing in this workflow's log to explain it.
#
# Two more deliberate constraints:
#   - amd64 only. Never arm64: Mealie runs on k8s8, a Proxmox VM.
#   - no floating tag, ever. Every push carries an explicit, immutable tag
#     (v3.24.0-woe.N on a release tag, v3.24.0-woe.dev.<sha> on a branch push).
#     A floating tag implies `imagePullPolicy: Always`, which is how a
#     multi-gigabyte pull on every restart takes this cluster down.

on:
  # Manual trigger. The push triggers below still work and are still the
  # normal path; this exists for the case where the operator has a browser
  # and no shell - a release is cut by running this with an explicit tag
  # rather than by pushing one from a workstation.
  #
  # The `tag` input is validated against the same v*-woe.* shape the tag
  # trigger enforces, and is refused if that tag already exists in GHCR.
  # Both guards protect the immutability rule spelled out at the bottom of
  # this comment block: no tag in this registry ever moves.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v3.24.0-woe.12. Blank = dev tag pinned to this commit."
        required: false
        type: string
  push:
    branches:
      - "woe/**"
    tags:
      - "v*-woe.*"

concurrency:
  group: woe-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.resolve.outputs.image-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve image tag
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            # Manual run with an explicit tag. Enforce the same shape the tag
            # trigger matches, so a hand-typed tag cannot land off-pattern.
            case "$INPUT_TAG" in
              v*-woe.*) ;;
              *)
                echo "::error::tag input must match v*-woe.* (got '${INPUT_TAG}')"
                exit 1
                ;;
            esac
            # Refuse to rebuild a tag that already exists. Overwriting one
            # would silently change what is already running on the cluster,
            # which is exactly what the no-floating-tag rule below forbids.
            token="$(curl -fsSL "https://ghcr.io/token?scope=repository:cowdogmoo/mealie:pull&service=ghcr.io" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            code="$(curl -sSL -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/cowdogmoo/mealie/manifests/${INPUT_TAG}")"
            if [ "$code" = "200" ]; then
              echo "::error::ghcr.io/cowdogmoo/mealie:${INPUT_TAG} already exists; pick the next number"
              exit 1
            fi
            echo "Tag ${INPUT_TAG} is free (manifest probe returned ${code})."
            image_tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            # The release tag is already the image tag, e.g. v3.24.0-woe.1
            image_tag="$REF_NAME"
          else
            # Branch build: pin the tag to this commit so no two builds ever
            # share one, and so nothing in the cluster can silently move.
            base="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
            image_tag="v${base}-woe.dev.${GITHUB_SHA:0:7}"
          fi
          echo "image-tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "Image: ghcr.io/cowdogmoo/mealie:${image_tag}" >> "$GITHUB_STEP_SUMMARY"

  test-backend:
    name: Test Backend
    uses: ./.github/workflows/test-backend.yml

  test-frontend:
    name: Test Frontend
    uses: ./.github/workflows/test-frontend.yml

  build-package:
    name: Build Package
    uses: ./.github/workflows/build-package.yml
    needs:
      - resolve-tag
    # `tag` is the only input build-package.yml requires; it is written into
    # mealie/__init__.py as __version__, so the running app reports the same
    # string the image is tagged with. `ref` is left unset: it defaults to
    # github.sha, which is the commit we want.
    with:
      tag: ${{ needs.resolve-tag.outputs.image-tag }}

  publish-image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - build-package
      # Upstream's nightly.yml gates publish on these two, and the fork's whole safety story is
      # that what lands on the cluster passed the same checks the branch did. Without this a red
      # suite still produces a pushed image, and the first thing anyone learns about it is a
      # broken pod. They run in parallel with the package build, so this costs wall-clock only
      # when something is actually wrong.
      - test-backend
      - test-frontend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve Python package
        uses: actions/download-artifact@v6
        with:
          name: backend-dist
          path: dist

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile
          context: .
          build-contexts: |
            packages=dist
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cowdogmoo/mealie:${{ needs.resolve-tag.outputs.image-tag }}
          labels: |
            org.opencontainers.image.title=mealie
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve-tag.outputs.image-tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize the pushed image
        env:
          IMAGE_TAG: ${{ needs.resolve-tag.outputs.image-tag }}
        run: |
          set -euo pipefail
          {
            echo "Pushed \`ghcr.io/cowdogmoo/mealie:${IMAGE_TAG}\` (linux/amd64)."
            echo ""
            echo "If the deploy comes back ImagePullBackOff, measure the package visibility"
            echo "before anything else - do not assume either answer:"
            echo ""
            echo '    gh api /orgs/CowDogMoo/packages/container/mealie --jq .visibility'
            echo ""
            echo "If it reports private, flip it once in the GitHub package settings, or give"
            echo "the home-automation namespace an imagePullSecret."
          } >> "$GITHUB_STEP_SUMMARY"
